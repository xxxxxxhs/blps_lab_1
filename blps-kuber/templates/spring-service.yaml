apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Release.Name }}-blps
  name: {{ .Release.Name }}-spring-service
spec:
  selector:
    app: {{ .Release.Name }}-blps
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.server.port }}