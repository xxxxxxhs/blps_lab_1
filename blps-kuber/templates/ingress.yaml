apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "blps.fkqly.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service: 
                name: {{ .Release.Name }}-spring-service
                port: 
                  number: {{ .Values.service.port }}