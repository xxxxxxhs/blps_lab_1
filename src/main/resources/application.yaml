server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: courier-backend
    instance-num: ${INSTANCE_NUM:0}
  datasource:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    dbname: ${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NarayanaJtaPlatform
  jta:
    enabled: true
    narayana:
      transaction-manager-id: ${NARAYANA_TM_ID:local-tm}

activemq:
  host: ${ACTIVEMQ_HOST:localhost}
  stomp-port: ${ACTIVEMQ_STOMP_PORT:61613}
  broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
  queue: ${ACTIVEMQ_QUEUE:order.notifications}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: logstash